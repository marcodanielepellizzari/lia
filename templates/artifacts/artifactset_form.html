{% extends "base.html" %}
{% block title %}Nuovo set di artefatti{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="h3 mb-4">Nuovo set di artefatti</h1>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">{{ form.name.label }}</label>
                {{ form.name }}
            </div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label">{{ form.default_symbol.label }}</label>
                    {{ form.default_symbol }}
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label">{{ form.default_color.label }}</label>
                    {{ form.default_color }}
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Crea e aggiungi artefatti</button>
        </form>
    </div>
</div>
{% endblock %}
